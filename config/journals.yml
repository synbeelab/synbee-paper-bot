# ============================================================================
# bioRxiv 등 preprint — RSS / 별도 API
# (PaperBee가 직접 처리. 저널명 필터 불필요)
# ============================================================================

preprint_subjects:
  biorxiv:
    - "synthetic_biology"
    - "microbiology"
    - "biochemistry"
    - "molecular_biology"
    - "bioengineering"
  chemrxiv:
    active: false                   # 활성화 전 검토
    categories:
      - "chemical-biology"
      - "biochemistry"

# ============================================================================
# RSS 보충 — PubMed 인덱싱 지연 회피용 (top-tier 즉시 모니터링)
# ============================================================================

rss_feeds:
  - name: "Nature"
    url: "https://www.nature.com/nature.rss"
  - name: "Nature Biotechnology"
    url: "https://www.nature.com/nbt.rss"
  - name: "Nature Chemical Biology"
    url: "https://www.nature.com/nchembio.rss"
  - name: "Nature Microbiology"
    url: "https://www.nature.com/nmicrobiol.rss"
  - name: "Nature Methods"
    url: "https://www.nature.com/nmeth.rss"
  - name: "Science"
    url: "https://www.science.org/rss/news_current.xml"
  - name: "Cell"
    url: "https://www.cell.com/cell/current.rss"
  - name: "Cell Host & Microbe"
    url: "https://www.cell.com/cell-host-microbe/current.rss"
  - name: "Metabolic Engineering"
    url: "https://www.sciencedirect.com/journal/metabolic-engineering/rss"
  - name: "bioRxiv synbio"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=synthetic_biology"
  - name: "bioRxiv microbiology"
    url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=microbiology"
