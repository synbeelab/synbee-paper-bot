# ToC 전수 스윕 대상 저널 (Crossref 기반)
#
# 왜 별도 소스가 필요한가
# -----------------------
# 스윕에 넣는 이유는 두 종류다.
#
# 축 1) 이메일이 그 호·기간의 목록을 아예 다 담지 못한다. 2026-08-22 실측:
#      Nature Communications  주간 e-alert = 섹션당 3편씩 12편 / 실제 214~296편  (~5%)
#      PNAS                   호 알림 = front matter 15~18개 / 실제 84~106편     (~17%)
#      iScience               50편 / 465편                                       (10.8%)
#      Cell Reports           53편 / 145편                                       (36.5%)
#    (Cell Press 템플릿은 ~50개 항목에서 끊는다. 그래서 호가 50을 넘는 둘만 잘린다.)
#
# 축 2) 이메일은 호 단위인데, online-first 논문은 호가 배정될 때까지 어느 메일에도
#    없다. created 2026-06-01~08-14 기준 미배정 비율:
#      ACS 8종            21%  (J Nat Prod 62%, ACS Cent Sci 49%, JACS 11%)
#      Cell Press 8종  10~87%  (Trends Biotechnol 87%, 호 배정 지연 중위 121일)
#    영구 손실은 아니지만 4개월 지연은 주간 인지로는 누락이다.
# 2) weekly PubMed 스윕(fetch_from_pubmed_weekly)은 저널 화이트리스트 AND
#    키워드 게이트다. 제목·초록에 키워드가 없으면 잡히지 않는다. 실제 누락 경로.
# 3) publisher 사이트 직접 열람은 자동화 불가 — pnas.org는 HTTP 403,
#    nature.com은 303 → idp.nature.com 쿠키 리다이렉트(RSS도 303).
#    Crossref API가 유일하게 안정적인 전수 확보 경로다.
#
호·기간 목록을 전부 담는 것으로 실측 확인된 템플릿(축 1 통과):
#   ACS ealerts (JACS 148(32) 110=110, Biochemistry 65(16) 18=18)
#   Nature 월간(Nat Biotechnol 44(8) 39항목) · Nature 주간(656(8128) 102항목)
#   Wiley(Adv Sci 13(46) 66항목) · AAAS(Sci Adv 12(33) 85=85)
#   ScienceDirect(Metab Eng 97 22=22) · OUP(NAR 54(14) 63=63) · EMBO J 45(16) 19항목
#
# ⚠️ 2026-08-24 정정: 첫 판에서 ACS를 "호의 1.1~6.8%만 노출"로 적었던 것은 오류다.
# 제목의 페이지 범위(PAGES 34639-34654)를 목록 범위로 해석하고 본문을 세지 않았다.
# 세어보니 호 전수였다. journalalerts@ -> ealerts@ 전환은 템플릿 교체였을 뿐이다.
# 교훈: 대리 지표로 판정하지 말고 이메일 본문 항목을 셀 것.

# Crossref 조회 시 창을 이 일수만큼 더 뒤로 넓힌다.
# Crossref 등재는 발행 후 1~3일 지연될 수 있어, 창 경계에 걸친 논문이
# "다음 주 창은 이미 지나갔고 이번 주 창엔 아직 없던" 상태로 영구 누락된다.
# 중복은 seen.db가 걸러내므로 겹침은 공짜다.
overlap_days: 3

# 저널마다 Crossref에 예치하는 날짜가 다르다. 기본값은 pub(발행일).
#   datefield: created  ← Elsevier(Cell Press/ScienceDirect) 필수.
#   이쪽은 published-print를 '월' 단위로만 예치하고 published-online이 없어서,
#   Crossref가 2026-09를 2026-09-01로 읽는다. 월 중순 주간 창에는 한 편도 안 걸린다.
#   2026-08-14~24 실측: iScience pub 0 / created 80, Cell Reports 0 / 49, Cell 0 / 16.

journals:
  - name: "Nature Communications"
    issn: "2041-1723"
    active: true
    # 주간 e-alert가 섹션당 3편만 노출. Biological sciences 섹션만 주당 120편.
    note: "email 12 / actual 214-296 per week (~5%)"

  - name: "Proc Natl Acad Sci U S A"
    issn: "1091-6490"
    active: true
    # 호 알림에 front matter(Commentary/Perspective/Letter/In This Issue)와 정정만 실림.
    note: "email 15-18 / actual 84-106 per issue (~17%)"

  # --- ASAP 노출 때문에 넣은 ACS 8종 (2026-08-24 활성화) ---------------------
  # 게시량 상한은 두지 않는다(weekly.max_posts: null): 상한은 통과 논문을 조용히
  # 버리고 seen.db에 기록해 영구 누락을 만든다.
  - name: "J Am Chem Soc"
    issn: "1520-5126"
    active: true
    note: "이메일은 호 전수(110=110). ASAP 11%가 호 배정까지 미노출. 주당 ~110편"
  - name: "ACS Catal"
    issn: "2155-5435"
    active: true
    note: "이메일은 호 전수. ASAP 38%가 호 배정까지 미노출"
  - name: "ACS Synth Biol"
    issn: "2161-5063"
    active: true
    note: "이메일은 호 전수. ASAP 17%. 월 ~19편으로 소규모"
  - name: "ACS Chem Biol"
    issn: "1554-8937"
    active: true
    note: "이메일은 호 전수. ASAP 21%. 월 ~30편"
  - name: "Biochemistry"
    issn: "1520-4995"
    active: true
    note: "이메일은 호 전수(18=18). ASAP 14%"
  - name: "J Nat Prod"
    issn: "1520-6025"
    active: true
    note: "이메일은 호 전수. ASAP 62% — ACS 중 노출 최대. 월 ~14편"
  - name: "ACS Cent Sci"
    issn: "2374-7951"
    active: true
    note: "ASAP 49% — ACS 중 두 번째. 월 ~15편"
  - name: "JACS Au"
    issn: "2691-3704"
    active: true
    note: "이메일은 호 전수. ASAP 39%. 월 ~48편"
  - name: "Cell Rep"
    issn: "2211-1247"
    active: true
    datefield: created
    note: "Cell Press 이메일 상한 ~50편 → 53/145 노출 (92편 누락)"
  - name: "iScience"
    issn: "2589-0042"
    active: true
    datefield: created
    note: "50/465 노출 (411편 누락). 켜면 주당 ~117편 추가"

  # --- Cell Press 나머지 8종 (2026-08-24 추가) ---------------------------------
  # 이 8종은 호 ToC 이메일 자체는 전수다(호 규모 9~46편 < 템플릿 상한 ~50편,
  # Cell 189(17) 실측 이메일 20항목 = Crossref 22편). 문제는 online-first다:
  # Cell Press는 논문을 먼저 online-first로 내고 나중에 호에 배정하며, 배정 전
  # 논문은 어느 메일에도 실리지 않는다. created 2026-06-01~08-14 기준 미배정 비율과
  # 호 배정 지연(중위):
  #   Trends Biotechnol 87% / 121일(최대 226일)   Trends Microbiol 62%
  #   Cell Chem Biol    39% /  17일               Cell             34% / 31일
  #   Cell Syst         31%                       Trends Chem      22%
  #   Mol Cell          11% /  16일               Cell Host Microbe 10%
  # 영구 손실은 아니지만 Trends 계열은 4개월 지연이라 주간 인지로는 누락에 가깝다.
  # 전원 datefield: created — Elsevier는 published-print를 '월' 단위로만 예치한다.
  - name: "Cell"
    issn: "0092-8674"
    active: true
    datefield: created
    note: "호는 전수. online-first 미배정 34%, 호 배정 지연 중위 31일"
  - name: "Mol Cell"
    issn: "1097-2765"
    active: true
    datefield: created
    note: "미배정 11%, 지연 중위 16일"
  - name: "Cell Syst"
    issn: "2405-4712"
    active: true
    datefield: created
    note: "미배정 31%"
  - name: "Cell Host Microbe"
    issn: "1931-3128"
    active: true
    datefield: created
    note: "미배정 10%"
  - name: "Cell Chem Biol"
    issn: "2451-9456"
    active: true
    datefield: created
    note: "미배정 39%, 지연 중위 17일"
  - name: "Trends Biotechnol"
    issn: "0167-7799"
    active: true
    datefield: created
    note: "미배정 87%, 지연 중위 121일 — 이 배치에서 노출이 가장 큰 저널"
  - name: "Trends Microbiol"
    issn: "0966-842X"
    active: true
    datefield: created
    note: "미배정 62%"
  - name: "Trends Chem"
    issn: "2589-5974"
    active: true
