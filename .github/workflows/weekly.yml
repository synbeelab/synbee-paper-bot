name: SynBEE weekly journal digest

on:
  schedule:
    # 매주 토 KST 09:30 = 토 UTC 00:30. daily(명목 08:00 = 23:00 UTC)보다 뒤에 돌아야
    # 한다: seen.db를 Actions 캐시로 주고받으므로, weekly가 daily의 cache/save 전에
    # cache/restore 하면 그 주 토요일 논문이 weekly에 "미확인"으로 보여 중복 게시되고,
    # weekly가 나중에 save하면 daily 추가분이 빠진 db가 최신 캐시가 되어 다음날 또 올라간다.
    # 30분 오프셋(08:30)으로는 부족했다 — GitHub 스케줄러 지연이 실측 45~57분,
    # 2026-07-27 weekly는 94분이었다. 정시(:00) cron이 가장 혼잡하므로 :30을 유지할 것.
    # 그래도 중복이 관측되면 on: workflow_run: 으로 daily 완료에 체이닝하고
    # job에서 date -u +%u 로 토요일만 통과시키는 방식으로 올릴 것.
    - cron: "30 0 * * 6"      # Sat 00:30 UTC = Sat 09:30 KST
  workflow_dispatch:
    inputs:
      since_days:
        description: "Override since_days (default 7)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no Slack push)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: synbee-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 30분으로는 부족하다. Crossref ToC 스윕이 붙은 뒤 한 주 분량이
    # PubMed 85 + Crossref 503 = 582편(2026-08-23 실측)이고, 전부 LLM 판정을
    # 거친다. 타임아웃으로 죽으면 watermark가 전진하지 않아 다음 주가 창을
    # 넓혀 재시도하지만, 그 주의 알림은 없었던 셈이 된다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          [ -z "$SLACK_BOT_TOKEN" ] && echo "❌ SLACK_BOT_TOKEN missing" && missing=1
          [ -z "$GEMINI_API_KEY" ] && echo "❌ GEMINI_API_KEY missing" && missing=1
          [ $missing -eq 1 ] && exit 1
          echo "✓ Required secrets present"

      # seen.db 캐시 — daily와 공유 (restore-keys 프리픽스 매칭으로 daily 최신 저장분을 복원)
      - name: Restore seen.db cache
        id: cache-seen
        uses: actions/cache/restore@v4
        with:
          path: data/seen.db
          key: synbee-seen-${{ github.run_id }}
          restore-keys: |
            synbee-seen-

      - name: Render config.yml
        run: |
          cp config/config.yml.example config/config.yml
          echo "Rendered config/config.yml (weekly channel hardcoded)"

      - name: Run weekly digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL || 'dosoyang@korea.ac.kr' }}
          PYTHONIOENCODING: "utf-8"
        run: |
          ARGS=""
          if [ -n "${{ inputs.since_days }}" ]; then
            ARGS="$ARGS --since-days ${{ inputs.since_days }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/run_weekly.py $ARGS

      - name: Save seen.db cache (always)
        if: always() && hashFiles('data/seen.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/seen.db
          key: synbee-seen-${{ github.run_id }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-log-${{ github.run_id }}
          path: |
            data/*.log
            data/seen.db
          if-no-files-found: ignore
          retention-days: 14

  # 60일 무활동 시 GitHub가 스케줄 워크플로우를 자동 비활성화하는 것을 막는다.
  # 이 액션은 GITHUB_TOKEN 입력만 받고 "자기가 실행된 워크플로우"만 살리므로,
  # daily.yml에 하나 있다고 이 파일이 보호되지는 않는다. 스케줄 워크플로우마다 필요.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
