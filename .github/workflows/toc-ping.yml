name: SynBEE ToC digest ping

# The weekly journal-ToC summary is generated + posted by a claude.ai cloud
# routine (trigger trig_01Mok3EWKMHWhstJonwKv7Sa) at Sat 09:00 KST, using the
# USER's Slack token. Slack never sends a push for your own message, so that
# digest is invisible on a phone. This bot ping — a different identity — is what
# actually reaches the phone. Same trick as schedule-ping.yml.
#
# The bot must be a member of #papers-daily (/invite @SynBEE Paper Bot).

on:
  schedule:
    # 토 09:30 KST = 토 00:30 UTC. ToC 루틴이 09:00에 시작하므로 30분 뒤에 핑.
    # weekly.yml(주간 delta)과 같은 시각 — 토요일 알림 창구를 한 번으로 모으기 위함.
    - cron: "30 0 * * 6"
    # weekly.yml의 catch-up과 같은 시각 — 토요일 알림 창구를 한 번으로 모으는 원칙 유지.
    - cron: "23 2 * * 6"      # Sat 11:23 KST
    - cron: "23 5 * * 6"      # Sat 14:23 KST
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # guard가 이 워크플로우의 지난 run을 조회한다

# keepalive 잡이 JavaScript 액션이므로 필요. GitHub는 2026-09-16에 Node 20을 제거한다.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: synbee-toc-ping
  cancel-in-progress: false

jobs:
  # GitHub는 schedule 이벤트를 best-effort로 발행한다 — 2026-08-26 전 워크플로우가
  # 5시간 지연됐고, 2026-08-27 사이클은 run 자체가 생기지 않아 08:00 KST 다이제스트가
  # 오지 않았다. 그래서 위에 catch-up cron을 뒀고, 이 guard가 "이미 배달된 날에는
  # 조용히 넘어가기"를 맡는다. 판정 기준은 KST 하루 1회 배달(synbee_bot/catchup.py).
  # 확인에 실패하면 fail-open, 즉 그냥 실행한다 — 중복 1건이 누락 하루보다 싸다.
  # guard 자체가 죽는 경우까지 포함해서, 아래 잡의 if: 조건이 '실행'을 기본값으로 둔다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's delivery already went out
        id: check
        env:
          WORKFLOW_FILE: "toc-ping.yml"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/catchup_guard.py

  ping:
    needs: guard
    # 기본값이 '실행'이다: guard가 죽거나 출력을 못 남겨도 배달은 나간다.
    # 'false'라고 명시적으로 답했을 때만 멈춘다 — needs: guard만으로는
    # guard 실패 시 이 잡이 skip되어 fail-closed가 되므로 !cancelled()가 필요하다.
    if: ${{ !cancelled() && needs.guard.outputs.should_run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Push ping to #papers-daily
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PAPERS_CHANNEL: "C0B2QJ179K6"
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          tok = os.environ["SLACK_BOT_TOKEN"]
          if not tok:
              raise SystemExit("SLACK_BOT_TOKEN missing")
          payload = {
              "channel": os.environ["PAPERS_CHANNEL"],
              "text": (":file_folder: 이번 주 저널 ToC 요약이 올라왔어요 — "
                       "위 ⭐ TOP 3부터 확인하세요. (⚠️ 표시가 보이면 루틴 오류)"),
              "unfurl_links": False,
              "unfurl_media": False,
          }
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": f"Bearer {tok}",
                       "Content-Type": "application/json; charset=utf-8"},
          )
          r = json.loads(urllib.request.urlopen(req, timeout=30).read())
          print(r)
          if not r.get("ok"):
              raise SystemExit(f"Slack error: {r.get('error')}")
          PY

  # 60일 무활동 시 GitHub가 스케줄 워크플로우를 자동 비활성화하는 것을 막는다.
  # 이 액션은 "자기가 실행된 워크플로우"만 살리므로 스케줄 워크플로우마다 필요하다.
  # 이 핑이 조용히 죽으면 ToC 요약 푸시 알림이 통째로 끊긴다.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
