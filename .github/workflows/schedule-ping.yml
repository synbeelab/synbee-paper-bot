name: SynBEE 일정 채널 ping

# Posts a one-line push notification to #일정 so Prof. Yang gets a phone alert.
# Slack sends no push for your own messages, and the routines below post as the
# user, so this bot ping (a different identity) is what actually reaches the
# phone. The bot must be a member of #일정.
#
# 2026-08-16: repointed. This used to announce the 07:50 schedule-briefing
# routine, which is now disabled — the ping would otherwise have advertised a
# briefing that never arrives. What still lands in #일정 is the 08:30 invitation
# triage summary (daily) and, on Saturdays, the R&D 과제공고 digest from
# synbeelab/rnd-search at 08:00. Firing at 08:40 covers both: the invitation
# routine takes 35–90 s, so it has always finished by then.

on:
  schedule:
    - cron: "40 23 * * *"    # 08:40 KST daily (10 min after the 08:30 invitation routine)
    # 이벤트 드롭 대비 catch-up — 늦은 핑이라도 없는 핑보다 낫다.
    - cron: "53 1 * * *"     # 10:53 KST
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # guard가 이 워크플로우의 지난 run을 조회한다

# keepalive 잡이 JavaScript 액션이므로 필요. GitHub는 2026-09-16에 Node 20을 제거한다.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: synbee-schedule-ping
  cancel-in-progress: false

jobs:
  # GitHub는 schedule 이벤트를 best-effort로 발행한다 — 2026-08-26 전 워크플로우가
  # 5시간 지연됐고, 2026-08-27 사이클은 run 자체가 생기지 않아 08:00 KST 다이제스트가
  # 오지 않았다. 그래서 위에 catch-up cron을 뒀고, 이 guard가 "이미 배달된 날에는
  # 조용히 넘어가기"를 맡는다. 판정 기준은 KST 하루 1회 배달(synbee_bot/catchup.py).
  # 확인에 실패하면 fail-open, 즉 그냥 실행한다 — 중복 1건이 누락 하루보다 싸다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's delivery already went out
        id: check
        env:
          WORKFLOW_FILE: "schedule-ping.yml"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/catchup_guard.py

  ping:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Push ping to #일정
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SCHEDULE_CHANNEL: "C0BKW7H4ABU"
          TZ: "Asia/Seoul"
        run: |
          python3 - <<'PY'
          import os, json, datetime, urllib.request
          tok = os.environ["SLACK_BOT_TOKEN"]
          if not tok:
              raise SystemExit("SLACK_BOT_TOKEN missing")
          # Saturday also carries the weekly R&D 과제공고 digest, which has
          # deadlines attached — name it so the push says what is actually there.
          is_saturday = datetime.datetime.now().weekday() == 5
          text = (":test_tube: 이번 주 R&D 과제공고 서베이 + 학술지 초청 처리 결과가 "
                  "#일정에 올라왔어요 — 공고는 마감이 있으니 확인하세요!"
                  if is_saturday else
                  ":envelope_with_arrow: 오늘의 학술지 초청 처리 결과가 #일정에 "
                  "올라왔어요 — 판단 필요 건이 있는지 확인하세요!")
          payload = {
              "channel": os.environ["SCHEDULE_CHANNEL"],
              "text": text,
              "unfurl_links": False,
              "unfurl_media": False,
          }
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": f"Bearer {tok}",
                       "Content-Type": "application/json; charset=utf-8"},
          )
          r = json.loads(urllib.request.urlopen(req, timeout=30).read())
          print(r)
          if not r.get("ok"):
              raise SystemExit(f"Slack error: {r.get('error')}")
          PY

  # 60일 무활동 시 GitHub가 스케줄 워크플로우를 자동 비활성화하는 것을 막는다.
  # 이 액션은 "자기가 실행된 워크플로우"만 살리므로 스케줄 워크플로우마다 필요하다.
  # 이 핑이 조용히 죽으면 일정 브리핑 푸시 알림이 통째로 끊긴다.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
