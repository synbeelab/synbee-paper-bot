name: Gmail spam rescue

on:
  schedule:
    # 정시(:00)를 피해 13분 앞당김 — daily.yml의 주석 참고.
    - cron: "47 21 * * *"    # 06:47 KST
    # 이벤트 드롭 대비 catch-up. 이미 구제가 돌아간 날은 guard가 스킵한다.
    - cron: "13 1 * * *"     # 10:13 KST
    - cron: "13 4 * * *"     # 13:13 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (classify and log, change no labels)"
        type: boolean
        required: false
        default: false
      max_rescues:
        description: "Override the rescue circuit breaker (default 40)"
        required: false
        default: ""
      min_confidence:
        description: "Override min confidence to rescue (default 6)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read     # guard가 이 워크플로우의 지난 run을 조회한다

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: synbee-spam-rescue
  cancel-in-progress: false

jobs:
  # GitHub는 schedule 이벤트를 best-effort로 발행한다 — 2026-08-26 전 워크플로우가
  # 5시간 지연됐고, 2026-08-27 사이클은 run 자체가 생기지 않아 08:00 KST 다이제스트가
  # 오지 않았다. 그래서 위에 catch-up cron을 뒀고, 이 guard가 "이미 배달된 날에는
  # 조용히 넘어가기"를 맡는다. 판정 기준은 KST 하루 1회 배달(synbee_bot/catchup.py).
  # 확인에 실패하면 fail-open, 즉 그냥 실행한다 — 중복 1건이 누락 하루보다 싸다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's delivery already went out
        id: check
        env:
          WORKFLOW_FILE: "spam-rescue.yml"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/catchup_guard.py

  run:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for name in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GEMINI_API_KEY; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "❌ $name missing"
              missing=1
            fi
          done
          [ $missing -eq 1 ] && exit 1
          echo "✓ Required secrets present"

      - name: Screen spam folder
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: "utf-8"
        run: |
          mkdir -p data
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.max_rescues }}" ]; then
            ARGS="$ARGS --max-rescues ${{ inputs.max_rescues }}"
          fi
          if [ -n "${{ inputs.min_confidence }}" ]; then
            ARGS="$ARGS --min-confidence ${{ inputs.min_confidence }}"
          fi
          python scripts/run_spam_rescue.py $ARGS 2>&1 | tee data/spam-rescue.log
          exit "${PIPESTATUS[0]}"

      # 결과 리포트 채널은 두지 않기로 했으므로, 무엇을 왜 옮겼는지 확인할 수 있는
      # 유일한 기록이 이 로그다. 실패한 run은 GitHub이 메일로 알려준다.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spam-rescue-log-${{ github.run_id }}
          path: data/spam-rescue.log
          if-no-files-found: ignore
          retention-days: 30

  # 60일 무활동 시 GitHub가 스케줄 워크플로우를 자동 비활성화하는 것을 막는다.
  # 이 액션은 GITHUB_TOKEN 입력만 받고 "자기가 실행된 워크플로우"만 살리므로,
  # daily.yml에 하나 있다고 이 파일이 보호되지는 않는다. 스케줄 워크플로우마다 필요.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
