name: Gmail spam rescue

on:
  schedule:
    # 매시간 훑는다. 하루 1회로는 부족했다 — 2026-09-02 아침 스윕(08:34 KST)
    # 뒤에 도착한 대학원 진학 문의와 수강 증원 요청이 스팸함에 그대로 남았고,
    # catch-up 두 번은 "오늘 이미 배달됨"으로 스킵됐다. 스윕은 다이제스트와
    # 달리 멱등하다: SpamRescueChecked가 이미 판정한 메일을 빼주므로 새 스팸이
    # 없는 실행은 Gmail list 호출 1건, 모델 호출 0건으로 끝난다. public repo라
    # Actions 분도 무료다. 정시(:00)는 GitHub 혼잡을 피해 비켜 둔다.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (classify and log, change no labels)"
        type: boolean
        required: false
        default: false
      max_rescues:
        description: "Override the rescue circuit breaker (default 40)"
        required: false
        default: ""
      min_confidence:
        description: "Override min confidence to rescue (default 6)"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: synbee-spam-rescue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for name in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GEMINI_API_KEY; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "❌ $name missing"
              missing=1
            fi
          done
          [ $missing -eq 1 ] && exit 1
          echo "✓ Required secrets present"

      - name: Screen spam folder
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: "utf-8"
        run: |
          mkdir -p data
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.max_rescues }}" ]; then
            ARGS="$ARGS --max-rescues ${{ inputs.max_rescues }}"
          fi
          if [ -n "${{ inputs.min_confidence }}" ]; then
            ARGS="$ARGS --min-confidence ${{ inputs.min_confidence }}"
          fi
          python scripts/run_spam_rescue.py $ARGS 2>&1 | tee data/spam-rescue.log
          exit "${PIPESTATUS[0]}"

      # 결과 리포트 채널은 두지 않기로 했으므로, 무엇을 왜 옮겼는지 확인할 수 있는
      # 유일한 기록이 이 로그다. 실패한 run은 GitHub이 메일로 알려준다.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spam-rescue-log-${{ github.run_id }}
          path: data/spam-rescue.log
          if-no-files-found: ignore
          retention-days: 30

  # 60일 무활동 시 GitHub가 스케줄 워크플로우를 자동 비활성화하는 것을 막는다.
  # 이 액션은 GITHUB_TOKEN 입력만 받고 "자기가 실행된 워크플로우"만 살리므로,
  # daily.yml에 하나 있다고 이 파일이 보호되지는 않는다. 스케줄 워크플로우마다 필요.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
