name: Gmail spam rescue

on:
  schedule:
    # 매일 KST 07:00 = UTC 22:00 (전날). cron은 UTC.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (classify and log, change no labels)"
        type: boolean
        required: false
        default: false
      max_rescues:
        description: "Override the rescue circuit breaker (default 40)"
        required: false
        default: ""
      min_confidence:
        description: "Override min confidence to rescue (default 6)"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: synbee-spam-rescue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for name in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GEMINI_API_KEY; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "❌ $name missing"
              missing=1
            fi
          done
          [ $missing -eq 1 ] && exit 1
          echo "✓ Required secrets present"

      - name: Screen spam folder
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: "utf-8"
        run: |
          mkdir -p data
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.max_rescues }}" ]; then
            ARGS="$ARGS --max-rescues ${{ inputs.max_rescues }}"
          fi
          if [ -n "${{ inputs.min_confidence }}" ]; then
            ARGS="$ARGS --min-confidence ${{ inputs.min_confidence }}"
          fi
          python scripts/run_spam_rescue.py $ARGS 2>&1 | tee data/spam-rescue.log
          exit "${PIPESTATUS[0]}"

      # 결과 리포트 채널은 두지 않기로 했으므로, 무엇을 왜 옮겼는지 확인할 수 있는
      # 유일한 기록이 이 로그다. 실패한 run은 GitHub이 메일로 알려준다.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spam-rescue-log-${{ github.run_id }}
          path: data/spam-rescue.log
          if-no-files-found: ignore
          retention-days: 30
