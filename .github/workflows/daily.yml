name: SynBEE daily paper digest

on:
  schedule:
    # 정시(:00) cron은 GitHub에서 가장 혼잡한 슬롯이라 지연·드롭이 잦다.
    # 13분 앞당겨 잡아 평시 지연(실측 8~14분)을 흡수하고 08:00 KST에 닿게 한다.
    - cron: "47 22 * * *"    # 07:47 KST (주말 포함)
    # 이벤트가 아예 드롭된 날을 위한 catch-up. 이미 배달된 날은 guard가 스킵하고,
    # 새 논문이 0편이면 run_daily.py가 애초에 아무것도 게시하지 않는다.
    - cron: "23 1 * * *"     # 10:23 KST
    - cron: "23 4 * * *"     # 13:23 KST
  workflow_dispatch:
    inputs:
      since_days:
        description: "Override since_days (e.g., 7 for backfill)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no Slack push)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read     # guard가 이 워크플로우의 지난 run을 조회한다

# Opt-in to Node.js 24 runtime for JavaScript actions.
# GitHub will force this default 2026-06-02 and remove Node 20 on 2026-09-16.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: synbee-daily
  cancel-in-progress: false

jobs:
  # GitHub는 schedule 이벤트를 best-effort로 발행한다 — 2026-08-26 전 워크플로우가
  # 5시간 지연됐고, 2026-08-27 사이클은 run 자체가 생기지 않아 08:00 KST 다이제스트가
  # 오지 않았다. 그래서 위에 catch-up cron을 뒀고, 이 guard가 "이미 배달된 날에는
  # 조용히 넘어가기"를 맡는다. 판정 기준은 KST 하루 1회 배달(synbee_bot/catchup.py).
  # 확인에 실패하면 fail-open, 즉 그냥 실행한다 — 중복 1건이 누락 하루보다 싸다.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's delivery already went out
        id: check
        env:
          WORKFLOW_FILE: "daily.yml"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/catchup_guard.py

  run:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          [ -z "$SLACK_BOT_TOKEN" ] && echo "❌ SLACK_BOT_TOKEN missing" && missing=1
          [ -z "$GEMINI_API_KEY" ] && echo "❌ GEMINI_API_KEY missing" && missing=1
          [ $missing -eq 1 ] && exit 1
          echo "✓ Required secrets present"

      # seen.db 캐시 — restore 전용 (자동 저장 비활성, 마지막 step에서만 명시 저장)
      - name: Restore seen.db cache
        id: cache-seen
        uses: actions/cache/restore@v4
        with:
          path: data/seen.db
          key: synbee-seen-${{ github.run_id }}
          restore-keys: |
            synbee-seen-

      - name: Render config.yml
        env:
          SLACK_DAILY_CHANNEL: ${{ secrets.SLACK_DAILY_CHANNEL }}
          SLACK_PRIORITY_CHANNEL: ${{ secrets.SLACK_PRIORITY_CHANNEL }}
          SLACK_TEST_CHANNEL: ${{ secrets.SLACK_TEST_CHANNEL }}
          USE_TEST_CHANNEL: ${{ secrets.USE_TEST_CHANNEL || 'true' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          src = Path("config/config.yml.example").read_text(encoding="utf-8")
          replacements = {
              'daily_digest: ""': f'daily_digest: "{os.environ.get("SLACK_DAILY_CHANNEL","")}"',
              'high_priority: ""': f'high_priority: "{os.environ.get("SLACK_PRIORITY_CHANNEL","")}"',
              'test: ""': f'test: "{os.environ.get("SLACK_TEST_CHANNEL","")}"',
              'use_test_channel: true': f'use_test_channel: {os.environ.get("USE_TEST_CHANNEL","true").lower()}',
          }
          out = src
          for k, v in replacements.items():
              out = out.replace(k, v, 1)
          Path("config/config.yml").write_text(out, encoding="utf-8")
          print("Rendered config/config.yml")
          PY

      - name: Run daily digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL || 'dosoyang@korea.ac.kr' }}
          PYTHONIOENCODING: "utf-8"
        run: |
          ARGS=""
          if [ -n "${{ inputs.since_days }}" ]; then
            ARGS="$ARGS --since-days ${{ inputs.since_days }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/run_daily.py $ARGS

      - name: Save seen.db cache (always)
        if: always() && hashFiles('data/seen.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/seen.db
          key: synbee-seen-${{ github.run_id }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            data/*.log
            data/seen.db
          if-no-files-found: ignore
          retention-days: 14

  # 60일 무활동 시 GitHub가 스케줄 워크플로우를 자동 비활성화하는 것을 방지.
  # 매 실행마다 워크플로우를 재활성화해 비활성 타이머를 리셋한다.
  # https://github.com/liskin/gh-workflow-keepalive
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
