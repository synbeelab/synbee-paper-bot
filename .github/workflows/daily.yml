name: SynBEE daily paper digest

on:
  schedule:
    # 매일 KST 08:00 = UTC 23:00 (전날). cron은 UTC.
    - cron: "0 23 * * 0-4"   # Sun~Thu UTC = Mon~Fri KST
  workflow_dispatch:
    inputs:
      since_days:
        description: "Override since_days (e.g., 7 for backfill)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no Slack push)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: synbee-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # seen.db를 캐시해서 중복 푸시 방지 (action 실행 간 영속화)
      - name: Restore seen.db cache
        id: cache-seen
        uses: actions/cache@v4
        with:
          path: data/seen.db
          # date 키로 강제 매일 새로 저장 + restore-keys로 가장 최근 것 복원
          key: synbee-seen-${{ github.run_id }}
          restore-keys: |
            synbee-seen-

      - name: Render config.yml
        env:
          SLACK_DAILY_CHANNEL: ${{ secrets.SLACK_DAILY_CHANNEL }}
          SLACK_PRIORITY_CHANNEL: ${{ secrets.SLACK_PRIORITY_CHANNEL }}
          SLACK_TEST_CHANNEL: ${{ secrets.SLACK_TEST_CHANNEL }}
          USE_TEST_CHANNEL: ${{ secrets.USE_TEST_CHANNEL || 'true' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          src = Path("config/config.yml.example").read_text(encoding="utf-8")
          replacements = {
              'daily_digest: ""': f'daily_digest: "{os.environ.get("SLACK_DAILY_CHANNEL","")}"',
              'high_priority: ""': f'high_priority: "{os.environ.get("SLACK_PRIORITY_CHANNEL","")}"',
              'test: ""': f'test: "{os.environ.get("SLACK_TEST_CHANNEL","")}"',
              'use_test_channel: true': f'use_test_channel: {os.environ.get("USE_TEST_CHANNEL","true").lower()}',
          }
          out = src
          for k, v in replacements.items():
              out = out.replace(k, v, 1)
          Path("config/config.yml").write_text(out, encoding="utf-8")
          print("Rendered config/config.yml")
          PY

      - name: Run daily digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL || 'dosoyang@korea.ac.kr' }}
          PYTHONIOENCODING: "utf-8"
        run: |
          ARGS=""
          if [ -n "${{ inputs.since_days }}" ]; then
            ARGS="$ARGS --since-days ${{ inputs.since_days }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/run_daily.py $ARGS

      - name: Save seen.db cache (always)
        if: always() && hashFiles('data/seen.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/seen.db
          key: synbee-seen-${{ github.run_id }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            data/*.log
            data/seen.db
          if-no-files-found: ignore
          retention-days: 14
